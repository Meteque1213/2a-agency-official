        const container = document.getElementById('registry-body');

        function generateDynamicJSONLD() {
            const data = currentCategory === 'LUXURY' ? luxuryData : beautyData;
            const scriptsContainer = document.getElementById('dynamic-jsonld') || document.createElement('div');
            scriptsContainer.id = 'dynamic-jsonld';
            scriptsContainer.innerHTML = ''; 
            
            data.forEach(item => {
                const schema = {
                    "@context": "https://schema.org",
                    "@type": "ClaimReview",
                    "itemReviewed": { "@type": "Brand", "name": item.name },
                    "reviewRating": { "@type": "Rating", "ratingValue": item.score, "bestRating": "100" },
                    "author": { "@type": "Organization", "name": "2A Agency Forensic Intelligence Unit" },
                    "url": `https://basescan.org/tx/${item.hash}`
                };
                const script = document.createElement('script');
                script.type = "application/ld+json";
                script.text = JSON.stringify(schema);
                scriptsContainer.appendChild(script);
            });
            document.body.appendChild(scriptsContainer);
        }

        function switchCategory(category) {
            currentCategory = category;
            document.getElementById('tab-LUXURY').classList.remove('active', 'opacity-100');
            document.getElementById('tab-BEAUTY').classList.remove('active', 'opacity-100');
            document.getElementById('tab-LUXURY').classList.add('opacity-30');
            document.getElementById('tab-BEAUTY').classList.add('opacity-30');
            document.getElementById(`tab-${category}`).classList.add('active', 'opacity-100');
            document.getElementById(`tab-${category}`).classList.remove('opacity-30');
            renderTable();
        }

        function renderTable() {
            container.innerHTML = '';
            const data = currentCategory === 'LUXURY' ? luxuryData : beautyData;
            
            data.forEach((item, index) => {
                const isCritical = item.score < 50;
                const row = document.createElement('tr');
                row.className = "border-b border-black/5 text-[11px] uppercase font-bold hover:bg-black/[0.01] transition-colors";
                row.innerHTML = `
                    <td class="py-8 opacity-20 font-mono">#${String(index + 1).padStart(3, '0')}</td>
                    <td class="py-8 tracking-widest">${item.name} ${isCritical ? '<span class="ml-2 text-[8px] bg-red-600 text-white px-1 py-0.5 rounded">DRIFT_ALERT</span>' : ''}</td>
                    <td class="py-8 ${isCritical ? 'text-red-600' : 'text-[#064e3b]'} font-black text-sm">${item.score}</td>
                    <td class="py-8 hidden md:table-cell text-center">
                        <span class="text-[9px] px-2 py-1 rounded border ${isCritical ? 'border-red-200 text-red-600 bg-red-50' : 'border-green-100 text-green-800 bg-green-50'}">
                            ${isCritical ? 'NON_COMPLIANT' : 'COMPLIANT'}
                        </span>
                    </td>
                    <td class="py-8 font-mono text-[9px] opacity-40">
                        <a href="https://basescan.org/tx/${item.hash}" target="_blank" class="flex items-center gap-1 hover:underline text-blue-600 font-black">
                            PROVE_ON_BASE
                        </a>
                    </td>
                `;
                container.appendChild(row);
            });
            // On génère les micro-certificats à chaque rendu
            generateDynamicJSONLD();
        }

        renderTable();
    </script>
