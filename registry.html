function switchTab(category) {
    localStorage.setItem('activeCategory', category);
    const body = document.getElementById('registry-body');
    const tabs = {
        luxury: document.getElementById('tab-luxury'),
        beauty: document.getElementById('tab-beauty'),
        longevity: document.getElementById('tab-longevity')
    };

    // 1. Mise à jour visuelle des onglets
    const activeClass = 'pb-2 text-xs uppercase tracking-widest tab-active';
    const inactiveClass = 'pb-2 text-xs uppercase tracking-widest opacity-40';
    Object.keys(tabs).forEach(key => {
        if(tabs[key]) tabs[key].className = category === key ? activeClass : inactiveClass;
    });

    // 2. Génération du contenu trié
    body.innerHTML = '';
    if (brands[category]) {
        // On trie par score décroissant
        [...brands[category]].sort((a, b) => b.score - a.score).forEach((brand, index) => {
            
          // Logique de statut Forensic
const status = brand.score >= 90 ? "SUPREMACY" : 
               (brand.score > 80 ? "EXCELLENCE" : 
               (brand.score < 60 ? "DRIFT ALERT" : "VIGILANCE"));

// Ici on utilise .bg-supremacy (le bleu Base) pour le top niveau
const statusClass = brand.score >= 90 ? "bg-supremacy" :
                    (brand.score > 80 ? "bg-emerald-500 text-white" : 
                    (brand.score < 60 ? "bg-red-500 text-white animate-pulse" : "bg-amber-400 text-black"));
            // On gère le lien (soit tx pour Longevity, soit hash pour les autres)
            const proofLink = brand.tx ? `https://basescan.org/tx/${brand.tx}` : `https://basescan.org/tx/${brand.hash}`;

            body.innerHTML += `
                <tr class="border-b border-white border-opacity-5 transition-all hover:bg-white hover:bg-opacity-5">
                    <td class="py-6 font-mono opacity-40 text-[10px]">#${(index + 1).toString().padStart(3, '0')}</td>
                    <td class="py-6 font-bold uppercase tracking-wider text-xs">${brand.name}</td>
                    <td class="py-6 font-mono text-xs">${brand.score}/100</td>
                    <td class="py-6">
                        <span class="px-2 py-1 rounded-sm text-[8px] tracking-tighter ${statusClass}">
                            ${status}
                        </span>
                    </td>
                    <td class="py-6 text-right">
                        <a href="${proofLink}" target="_blank" class="font-mono text-[9px] opacity-40 hover:opacity-100 underline tracking-tighter">
                            PROVE_ON_BASE ↗
                        </a>
                    </td>
                </tr>
            `;
        });
    }
}
        
        window.onload = () => {
            const savedCategory = localStorage.getItem('activeCategory') || 'luxury';
            switchTab(savedCategory);
        };
    </script>
