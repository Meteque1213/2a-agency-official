<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Entity Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #E5E7EB; font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.5s; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .text-2a-emerald { color: #10b981; }
        .bg-2a-dark { background-color: #0A0A0A; }
        .border-glow { border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12">

    <nav class="flex justify-between items-center w-full max-w-6xl mx-auto mb-12 border-b border-white/10 pb-6">
        <div class="font-black tracking-[0.3em] text-[12px] uppercase text-2a-emerald cursor-pointer" onclick="window.location.href='audits.html'">2A Agency / System of Record</div>
        <div id="top-id" class="flex gap-6 text-[9px] uppercase tracking-widest font-bold opacity-60 text-white italic">SOR_ID: LOADING...</div>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start gap-8 mb-12">
            <div>
                <h1 id="entity-name" class="text-6xl md:text-8xl font-black tracking-tighter mb-4 text-white uppercase italic">---</h1>
                <div class="flex flex-wrap items-center gap-4">
                    <span id="audit-status" class="px-3 py-1 bg-emerald-500/10 text-2a-emerald text-[10px] font-bold tracking-widest uppercase border border-emerald-500/20 italic">Verification Active</span>
                </div>
            </div>
            <div class="bg-2a-dark border border-white/10 p-6 text-right">
                <p class="text-[10px] uppercase tracking-widest opacity-40 mb-1 font-bold italic text-white">Trust Index</p>
                <p id="trust-score" class="text-7xl font-black text-2a-emerald leading-none">--</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-2a-dark border border-white/10 p-8 border-glow">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-8 text-emerald-400 italic">01. AI Gateway Statement</h3>
                <div id="ai-statement-data" class="space-y-5 mono text-[11px]"></div>
            </div>
            <div class="bg-2a-dark border border-white/10 p-8 border-glow">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400 italic">02. Entity Ontology</h3>
                <div id="ontology-data" class="flex flex-col gap-3 text-white font-bold text-[10px]"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12 text-white">
            <div class="bg-2a-dark border border-emerald-500/30 p-8 italic">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400">Institutional Sector</h3>
                <div id="sector-data" class="space-y-4 mono text-[11px]"></div>
            </div>
            <div class="bg-2a-dark border border-emerald-500/30 p-8 italic">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400">Node Configuration</h3>
                <div id="node-data" class="space-y-4 mono text-[11px]"></div>
            </div>
        </div>

        <div class="bg-emerald-950/20 border border-emerald-500/20 p-8 mb-12">
            <h4 class="text-[10px] font-black uppercase tracking-[0.4em] mb-6 text-2a-emerald">Cryptographic Proof (ERC-8004)</h4>
            <div id="verification-root" class="mono text-[10px] opacity-40 italic underline mb-4 break-all">Verification Root: LOADING...</div>
        </div>
    </main>

    <script>
        async function loadEntityData() {
            const urlParams = new URLSearchParams(window.location.search);
            const entityName = urlParams.get('name');
            
            try {
                // Utilisation du cache-buster ?t= pour forcer la mise à jour
                const response = await fetch('registry.json?t=' + Date.now());
                const data = await response.json();
                const entity = data.find(e => e.entity.name.toLowerCase() === entityName.toLowerCase());

                if (entity) {
                    document.getElementById('entity-name').innerText = entity.entity.name;
                    document.getElementById('top-id').innerText = `SOR_ID: ${entity.sor_id}`;
                    document.getElementById('trust-score').innerText = entity.trust.score;
                    document.getElementById('verification-root').innerText = `Verification Root: ${entity.proof.hash}`;

                    // --- 01. AI GATEWAY STATEMENT ---
                    document.getElementById('ai-statement-data').innerHTML = `
                        <div class="flex flex-col gap-3 pb-2 uppercase italic text-white">
                            <span class="opacity-40 text-[9px] tracking-widest">Main Statement</span>
                            <span class="font-bold leading-relaxed">${entity.ai_gateway?.statement || 'N/A'}</span>
                            <span class="opacity-40 text-[9px] tracking-widest mt-4">Character Guard</span>
                            <span class="text-[10px] opacity-80">${entity.ai_gateway?.character_guard || 'N/A'}</span>
                        </div>
                    `;

                    // --- 02. ONTOLOGY (Reporting & Governance) ---
                    document.getElementById('ontology-data').innerHTML = `
                        <div class="p-4 bg-white/5 border border-white/10 uppercase italic">
                            <span class="opacity-40 block mb-2 text-[8px]">Ontology Reporting</span>
                            <span class="text-emerald-400 font-bold">${entity.ai_gateway?.ontology?.reporting || 'N/A'}</span>
                        </div>
                        <div class="p-4 bg-white/5 border border-white/10 uppercase italic">
                            <span class="opacity-40 block mb-2 text-[8px]">Governance Protocol</span>
                            <span class="text-emerald-400 font-bold">${entity.ai_gateway?.ontology?.governance || 'N/A'}</span>
                        </div>
                    `;

                    // --- SECTOR ---
                    document.getElementById('sector-data').innerHTML = `
                        <div class="flex justify-between border-b border-white/5 pb-2 uppercase"><span class="opacity-40">Sector</span><span class="font-bold">${entity.entity.sector || 'N/A'}</span></div>
                        <div class="flex justify-between border-b border-white/5 pb-2 mt-4 uppercase"><span class="opacity-40">ERC8004 ID</span><span class="font-bold text-[10px]">${entity.entity.erc8004_id || 'N/A'}</span></div>
                    `;

                    // --- NODE DETAILS ---
                    document.getElementById('node-data').innerHTML = `
                        <div class="flex justify-between border-b border-white/5 pb-2 uppercase"><span class="opacity-40">Active Node</span><span class="font-bold text-emerald-500">${entity.trust.node || 'N/A'}</span></div>
                        <div class="flex justify-between border-b border-white/5 pb-2 mt-4 uppercase"><span class="opacity-40">Ledger Status</span><span class="font-bold">${entity.trust.status || 'STABLE'}</span></div>
                        <div class="flex justify-between border-b border-white/5 pb-2 mt-4 uppercase"><span class="opacity-40">TTL (Validity)</span><span class="font-bold">${entity.trust.ttl || 'N/A'}</span></div>
                    `;

                    document.body.style.opacity = 1;
                }
            } catch (err) { console.error("Critical: Data mismatch or fetch error", err); }
        }
        window.onload = loadEntityData;
    </script>
</body>
</html>
