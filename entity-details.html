<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Entity Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #E5E7EB; font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.5s; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .text-2a-emerald { color: #10b981; }
        .bg-2a-dark { background-color: #0A0A0A; }
        .border-glow { border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12">

    <nav class="flex justify-between items-center w-full max-w-6xl mx-auto mb-12 border-b border-white/10 pb-6">
        <div class="font-black tracking-[0.3em] text-[12px] uppercase text-2a-emerald cursor-pointer" onclick="window.location.href='audits.html'">2A Agency / System of Record</div>
        <div id="top-id" class="flex gap-6 text-[9px] uppercase tracking-widest font-bold opacity-60 text-white italic">SOR_ID: LOADING...</div>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start gap-8 mb-12">
            <div>
                <h1 id="entity-name" class="text-6xl md:text-8xl font-black tracking-tighter mb-4 text-white uppercase italic">---</h1>
                <div class="flex flex-wrap items-center gap-4">
                    <span id="audit-status" class="px-3 py-1 bg-emerald-500/10 text-2a-emerald text-[10px] font-bold tracking-widest uppercase border border-emerald-500/20 italic">Verification Active</span>
                </div>
            </div>
            <div class="bg-2a-dark border border-white/10 p-6 text-right">
                <p class="text-[10px] uppercase tracking-widest opacity-40 mb-1 font-bold italic text-white">Trust Index</p>
                <p id="trust-score" class="text-7xl font-black text-2a-emerald leading-none">--</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-2a-dark border border-white/10 p-8 border-glow">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-8 text-emerald-400 italic">01. Executive Leadership</h3>
                <div id="leadership-data" class="space-y-5 mono text-[11px]">
                    </div>
            </div>
            <div class="bg-2a-dark border border-white/10 p-8 border-glow">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400 italic">02. Core Product Stack</h3>
                <div id="product-stack" class="flex flex-col gap-3 text-white font-bold text-[10px]">
                    </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12 text-white">
            <div class="bg-2a-dark border border-emerald-500/30 p-8 italic">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400">Institutional Licensing</h3>
                <div id="licensing-data" class="space-y-4 mono text-[11px]">
                     </div>
            </div>
            <div class="bg-2a-dark border border-emerald-500/30 p-8 italic">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400">Capital & Governance</h3>
                <div id="capital-data" class="space-y-4 mono text-[11px]">
                     </div>
            </div>
        </div>

        <div class="bg-emerald-950/20 border border-emerald-500/20 p-8 mb-12">
            <h4 class="text-[10px] font-black uppercase tracking-[0.4em] mb-6 text-2a-emerald">Cryptographic Proof (ERC-8004)</h4>
            <div id="verification-root" class="mono text-[10px] opacity-40 italic underline mb-4">Verification Root: LOADING...</div>
        </div>
    </main>

    <script>
        async function loadEntityData() {
            const urlParams = new URLSearchParams(window.location.search);
            const entityName = urlParams.get('name');
            
            if (!entityName) {
                console.error("No entity name provided in URL");
                return;
            }

            try {
                const response = await fetch('registry.json');
                const data = await response.json();
                
                // Recherche insensible à la casse
                const entity = data.find(e => e.entity.name.toLowerCase() === entityName.toLowerCase());

                if (entity) {
                    document.getElementById('entity-name').innerText = entity.entity.name;
                    document.getElementById('top-id').innerText = `SOR_ID: ${entity.sor_id}`;
                    document.getElementById('trust-score').innerText = entity.trust.score;
                    
                    // Preuve Cryptographique
                    if(entity.proof) {
                        document.getElementById('verification-root').innerText = `Verification Root: ${entity.proof.hash}`;
                    }

                    // --- LEADERSHIP (Gère String ou Array) ---
                    const rawLeaders = entity.details?.leadership || ["Data Ingestion Pending"];
                    const leaders = Array.isArray(rawLeaders) ? rawLeaders : [rawLeaders];
                    document.getElementById('leadership-data').innerHTML = leaders.map(l => `
                        <div class="flex justify-between border-b border-white/5 pb-2 uppercase italic">
                            <span class="opacity-40 uppercase">Officer</span>
                            <span class="font-bold text-white">${l}</span>
                        </div>
                    `).join('');

                    // --- PRODUCTS (Gère String ou Array) ---
                    const rawProducts = entity.details?.products || ["Analyzing Stack..."];
                    const products = Array.isArray(rawProducts) ? rawProducts : [rawProducts];
                    document.getElementById('product-stack').innerHTML = products.map(p => `
                        <div class="px-4 py-3 bg-white/5 border border-white/10 uppercase font-mono text-[10px] leading-relaxed text-emerald-100 italic">
                            ${p}
                        </div>
                    `).join('');

                    // --- LICENSING ---
                    document.getElementById('licensing-data').innerHTML = `
                        <div class="flex justify-between border-b border-white/5 pb-2 italic"><span class="opacity-40">REG STATUS</span><span class="font-bold text-white">${entity.details?.status || 'PENDING AUDIT'}</span></div>
                        <div class="flex justify-between border-b border-white/5 pb-2 italic mt-4"><span class="opacity-40">LICENSING</span><span class="font-bold text-white">${entity.details?.licensing || 'SCANNING...'}</span></div>
                    `;

                    // --- CAPITAL ---
                    document.getElementById('capital-data').innerHTML = `
                        <div class="flex justify-between border-b border-white/5 pb-2 italic"><span class="opacity-40">VALUATION</span><span class="font-bold text-white">${entity.details?.valuation || 'ESTIMATING...'}</span></div>
                        <div class="flex justify-between border-b border-white/5 pb-2 italic mt-4"><span class="opacity-40">FUNDING</span><span class="font-bold text-white">${entity.details?.funding || 'VERIFYING...'}</span></div>
                    `;

                    // Fade in once data is ready
                    document.body.style.opacity = 1;
                } else {
                    document.getElementById('entity-name').innerText = "ENTITY NOT FOUND";
                    document.body.style.opacity = 1;
                }
            } catch (err) { 
                console.error("Error loading data:", err); 
                document.getElementById('entity-name').innerText = "ERROR LOADING DATA";
                document.body.style.opacity = 1;
            }
        }
        window.onload = loadEntityData;
    </script>
</body>
</html>
