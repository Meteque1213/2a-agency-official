<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Entity Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #E5E7EB; font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.5s; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .text-2a-emerald { color: #10b981; }
        .bg-2a-dark { background-color: #0A0A0A; }
        .border-glow { border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12">

    <nav class="flex justify-between items-center w-full max-w-6xl mx-auto mb-12 border-b border-white/10 pb-6">
        <div class="font-black tracking-[0.3em] text-[12px] uppercase text-2a-emerald cursor-pointer" onclick="window.location.href='audits.html'">2A Agency / System of Record</div>
        <div id="top-id" class="flex gap-6 text-[9px] uppercase tracking-widest font-bold opacity-60 text-white italic">SOR_ID: LOADING...</div>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start gap-8 mb-12">
            <div>
                <h1 id="entity-name" class="text-6xl md:text-8xl font-black tracking-tighter mb-4 text-white uppercase italic">---</h1>
                <div class="flex flex-wrap items-center gap-4">
                    <span id="audit-status" class="px-3 py-1 bg-emerald-500/10 text-2a-emerald text-[10px] font-bold tracking-widest uppercase border border-emerald-500/20 italic">Verification Active</span>
                </div>
            </div>
            <div class="bg-2a-dark border border-white/10 p-6 text-right">
                <p class="text-[10px] uppercase tracking-widest opacity-40 mb-1 font-bold italic text-white">Trust Index</p>
                <p id="trust-score" class="text-7xl font-black text-2a-emerald leading-none">--</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-2a-dark border border-white/10 p-8 border-glow">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-8 text-emerald-400 italic">01. AI Gateway / Leadership</h3>
                <div id="leadership-data" class="space-y-5 mono text-[11px]"></div>
            </div>
            <div class="bg-2a-dark border border-white/10 p-8 border-glow">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400 italic">02. Ontology / Product Stack</h3>
                <div id="product-stack" class="flex flex-col gap-2 mb-6 text-white uppercase font-bold text-[9px]"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12 text-white">
            <div class="bg-2a-dark border border-emerald-500/30 p-8 italic">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400">Institutional Context</h3>
                <div id="licensing-data" class="space-y-4 mono text-[11px]"></div>
            </div>
            <div class="bg-2a-dark border border-emerald-500/30 p-8 italic">
                <h3 class="text-[11px] font-black uppercase tracking-[0.3em] mb-6 text-emerald-400">Governance & Node</h3>
                <div id="capital-data" class="space-y-4 mono text-[11px]"></div>
            </div>
        </div>

        <div class="bg-emerald-950/20 border border-emerald-500/20 p-8 mb-12">
            <h4 class="text-[10px] font-black uppercase tracking-[0.4em] mb-6 text-2a-emerald">Cryptographic Proof (ERC-8004)</h4>
            <div id="proof-hash" class="mono text-[10px] opacity-40 italic underline mb-4 break-all leading-relaxed">Verification Root: LOADING...</div>
        </div>
    </main>

    <script>
        async function loadEntityData() {
            const urlParams = new URLSearchParams(window.location.search);
            const entityName = urlParams.get('name');
            if (!entityName) return;

            try {
                // Ajout d'un cache-buster pour forcer la lecture du dernier JSON
                const response = await fetch('registry.json?v=' + Date.now());
                const data = await response.json();
                
                // Recherche flexible (insensible à la casse)
                const entity = data.find(e => e.entity.name.toLowerCase() === entityName.toLowerCase());

                if (entity) {
                    document.getElementById('entity-name').innerText = entity.entity.name;
                    document.getElementById('top-id').innerText = `SOR_ID: ${entity.sor_id}`;
                    document.getElementById('trust-score').innerText = entity.trust.score;
                    document.getElementById('proof-hash').innerText = `Verification Root: ${entity.proof?.hash || 'N/A'}`;

                    // --- 01. AI GATEWAY / LEADERSHIP ---
                    let leaderContent = "";
                    
                    // On gère le nouveau format AI GATEWAY (Array)
                    if (Array.isArray(entity.details?.ai_gateway)) {
                        leaderContent += entity.details.ai_gateway.map(item => 
                            `<div class="pb-2 border-b border-white/5"><span class="opacity-40 text-[9px]">AI_GATEWAY</span><br><span class="text-white text-[11px] font-bold italic">${item}</span></div>`
                        ).join('');
                    }
                    
                    // On ajoute le LEADERSHIP classique dessous
                    if (entity.details?.leadership) {
                        leaderContent += entity.details.leadership.map(l => 
                            `<div class="flex justify-between border-b border-white/5 pb-2 pt-2 uppercase"><span class="opacity-40 text-[9px]">OFFICER</span><span class="font-bold text-[10px]">${l}</span></div>`
                        ).join('');
                    }
                    
                    document.getElementById('leadership-data').innerHTML = leaderContent || "DATA PENDING";

                    // --- 02. ONTOLOGY / PRODUCTS ---
                    let productContent = "";
                    if (entity.details?.products) {
                        productContent = entity.details.products.map(p => 
                            `<span class="px-3 py-3 bg-white/5 border border-white/10 uppercase italic text-[10px] text-emerald-100 leading-relaxed">${p}</span>`
                        ).join('');
                    }
                    document.getElementById('product-stack').innerHTML = productContent || "ANALYZING...";

                    // --- INSTITUTIONAL CONTEXT ---
                    let instContent = "";
                    if (Array.isArray(entity.details?.institutional_context)) {
                        instContent = entity.details.institutional_context.map(i => 
                            `<div class="flex justify-between border-b border-white/5 pb-2"><span class="opacity-40">INFO</span><span class="font-bold text-white uppercase text-[9px] text-right">${i}</span></div>`
                        ).join('');
                    } else {
                        instContent = `<div class="flex justify-between border-b border-white/5 pb-2"><span class="opacity-40">SECTOR</span><span class="font-bold text-white uppercase">${entity.entity.category || 'N/A'}</span></div>`;
                    }
                    document.getElementById('licensing-data').innerHTML = instContent;

                    // --- GOVERNANCE & NODE ---
                    let govContent = "";
                    if (Array.isArray(entity.details?.governance_node)) {
                        govContent = entity.details.governance_node.map(g => 
                            `<div class="flex justify-between border-b border-white/5 pb-2"><span class="opacity-40">NODE</span><span class="font-bold text-white uppercase text-[9px] text-right">${g}</span></div>`
                        ).join('');
                    } else {
                        govContent = `<div class="flex justify-between border-b border-white/5 pb-2"><span class="opacity-40">STATUS</span><span class="font-bold text-white uppercase">${entity.trust.status || 'STABLE'}</span></div>`;
                    }
                    document.getElementById('capital-data').innerHTML = govContent;
                }
            } catch (err) { 
                console.error("Critical: Data mismatch", err);
                document.getElementById('entity-name').innerText = "FETCH_ERROR";
            }
        }
        window.onload = loadEntityData;
    </script>
</body>
</html>
