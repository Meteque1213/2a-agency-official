<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Lab Audits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fff; color: #000; scroll-behavior: smooth; }
        .audit-card { transition: all 0.2s ease; }
        .audit-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-color: #10b981; }
        .search-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.9); backdrop-blur: 10px; }
    </style>
</head>
<body class="p-6 md:p-12">
    <nav class="flex justify-between items-center mb-16 max-w-5xl mx-auto">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            <span class="font-bold text-sm tracking-tight uppercase">2A AGENCY</span>
        </div>
        <div class="flex gap-6 text-xs uppercase tracking-widest text-gray-500">
            <a href="index.html" class="hover:text-black">Home</a>
            <a href="audits.html" class="text-black font-bold underline decoration-2 underline-offset-8">Audits</a>
            <a href="whitepaper.html" class="hover:text-black">Protocol</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto">
        <div class="mb-12">
            <h1 class="text-[50px] md:text-[80px] font-bold leading-none tracking-tighter text-emerald-950">FORENSIC<br>LAB AUDITS</h1>
            <div class="flex items-center gap-2 mt-6 text-[10px] uppercase tracking-[0.3em] text-emerald-600 font-bold">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                <span id="audit-count">...</span> ENTITIES NOTARIZED ON BASE L2 / REAL-TIME DATABASE
            </div>
        </div>

        <div class="search-sticky py-6 mb-12 border-b border-gray-100">
            <input type="text" id="brandSearch" onkeyup="filterAudits()" 
                   placeholder="RECHERCHER UNE MARQUE, UN SECTEUR OU UNE ENTITÉ..." 
                   class="w-full bg-gray-50 border border-gray-200 p-6 font-mono text-xs tracking-[0.2em] focus:outline-none focus:border-emerald-500 transition-all uppercase rounded-sm">
        </div>

        <div id="audit-container" class="space-y-6 min-h-[500px]">
            <div class="text-center py-20 text-gray-400 text-xs uppercase tracking-widest animate-pulse">
                Synchronisation du registre forensic...
            </div>
        </div>

        <div class="border-t border-dashed border-gray-300 mt-24 pt-12 text-center pb-20">
            <span class="text-[10px] uppercase tracking-[0.5em] text-gray-400 italic font-bold">End of Live Registry — 2A Agency System of Records</span>
        </div>
    </main>

    <div id="memo-overlay" class="fixed inset-0 bg-white/98 z-[100] hidden p-4 md:p-12 overflow-y-auto backdrop-blur-md">
        <div class="max-w-3xl mx-auto border border-gray-200 p-8 md:p-16 shadow-2xl bg-white relative mt-10">
            <button onclick="closeMemo()" class="absolute top-6 right-6 text-gray-400 hover:text-black font-bold text-[10px] uppercase tracking-widest bg-gray-50 px-4 py-2 rounded-full transition-colors border border-gray-100">
                [ Fermer / Close ]
            </button>
            <div class="mb-8 border-b border-gray-100 pb-8 text-center">
                <div class="text-emerald-500 font-bold text-[10px] tracking-widest uppercase mb-2 italic">Official Forensic Notarization</div>
                <div id="memo-title" class="text-2xl font-bold tracking-tighter text-emerald-950 uppercase">REPORT</div>
            </div>
            <pre id="memo-content" class="text-emerald-950 font-mono text-[11px] md:text-xs leading-relaxed whitespace-pre-wrap pt-4 bg-gray-50 p-6 border border-gray-100 rounded-sm"></pre>
        </div>
    </div>

    <script>
        // Utilisation d'un timestamp pour forcer la mise à jour du fichier JSON (tue le cache)
        const REGISTRY_URL = './audits/registry.json?v=' + new Date().getTime();
        let allAudits = [];

        async function loadAudits() {
            try {
                const response = await fetch(REGISTRY_URL, { cache: "no-store" });
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                
                allAudits = await response.json();
                
                // Mise à jour du compteur
                const countElem = document.getElementById('audit-count');
                if (countElem) countElem.textContent = allAudits.length;

                renderAudits(allAudits);
            } catch (error) {
                console.error("Erreur de chargement du registre:", error);
                document.getElementById('audit-container').innerHTML = `
                    <div class="text-center py-20">
                        <div class="text-red-500 font-mono text-[10px] uppercase tracking-widest mb-4">
                            ⚠️ ERREUR DE SYNCHRONISATION : ${error.message}
                        </div>
                        <button onclick="location.reload()" class="text-[10px] font-bold uppercase border border-black px-6 py-2 hover:bg-black hover:text-white transition-all">
                            Réessayer la connexion
                        </button>
                    </div>`;
            }
        }

        function renderAudits(data) {
            const container = document.getElementById('audit-container');
            container.innerHTML = data.map(audit => {
                // Nettoyage dynamique du nom (Markdown cleanup)
                let name = audit.entity || audit.brand || "Unknown Entity";
                name = name.replace(/^- /g, '').replace(/\*\*/g, '').trim();

                const status = audit.status || audit.score || "VERIFIED";
                const id = audit.id || "2A-PENDING";
                const hash = audit.hash || "NOT_HASHED_YET";
                
                // Sécurisation du chemin du mémo
                const rawMemo = audit.memo || "";
                const memoPath = rawMemo.startsWith('audits/') ? rawMemo : `audits/${rawMemo}`;

                return `
                <div class="audit-card bg-white p-8 border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div class="flex flex-col gap-1">
                        <div class="text-[9px] font-black uppercase tracking-widest text-emerald-500 flex items-center gap-2 mb-1">
                            <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                            INTEGRITY: ${status}
                        </div>
                        <h2 class="text-2xl md:text-3xl font-bold tracking-tighter text-emerald-950">${name}</h2>
                        <div class="flex gap-2 mt-2">
                            <span class="bg-gray-100 text-gray-500 text-[9px] px-2.5 py-1 font-bold uppercase tracking-widest border border-gray-200">${id}</span>
                            <span class="bg-emerald-50 text-emerald-700 text-[9px] px-2.5 py-1 font-bold uppercase tracking-widest border border-emerald-100">ON-CHAIN</span>
                        </div>
                    </div>

                    <div class="flex flex-col md:items-end gap-4 w-full md:w-auto">
                        <div class="font-mono text-[9px] text-gray-400 break-all max-w-[250px] text-left md:text-right uppercase leading-tight">
                            HASH: ${hash}
                        </div>
                        <button onclick="openMemo('${memoPath}', '${name.replace(/'/g, "\\'")}')" class="bg-emerald-950 text-white px-8 py-4 text-[10px] font-bold uppercase tracking-widest hover:bg-emerald-500 transition-all w-full md:w-auto text-center shadow-lg shadow-emerald-900/10">
                            View Report →
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function filterAudits() {
            const query = document.getElementById('brandSearch').value.toUpperCase();
            const cards = document.getElementsByClassName('audit-card');
            for (let i = 0; i < cards.length; i++) {
                const nameText = cards[i].querySelector('h2').innerText.toUpperCase();
                cards[i].style.display = nameText.includes(query) ? "" : "none";
            }
        }

        async function openMemo(path, title) {
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error();
                const text = await response.text();
                document.getElementById('memo-title').textContent = title;
                document.getElementById('memo-content').textContent = text;
                document.getElementById('memo-overlay').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                alert("Rapport en cours de synchronisation. Veuillez réessayer dans quelques secondes.");
            }
        }

        function closeMemo() {
            document.getElementById('memo-overlay').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onload = loadAudits;
    </script>
</body>
</html>
