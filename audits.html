<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #000; color: #fff; }
        .glitch-hover:hover { text-shadow: 2px 0 #00ffaa, -2px 0 #ff00ff; }
        .audit-card { border-bottom: 1px solid #333; transition: all 0.3s ease; }
        .audit-card:hover { background: #111; border-bottom: 1px solid #00ffaa; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-8 flex justify-between items-center border-b border-white/10">
        <a href="index.html" class="text-2xl font-bold tracking-tighter">2A AGENCY</a>
        <div class="space-x-8 text-[10px] uppercase tracking-[0.3em]">
            <a href="audits.html" class="text-white border-b border-white">Registry</a>
            <a href="whitepaper.html" class="hover:text-emerald-400">Protocol</a>
            <a href="#" class="hover:text-emerald-400">Terminal</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-8 pt-20">
        <header class="mb-20">
            <h1 class="text-6xl font-black mb-4 tracking-tighter">FORENSIC REGISTRY</h1>
            <p class="text-emerald-400 text-xs tracking-widest uppercase">Immutable Audit Database on Base L2</p>
        </header>

        <section id="featured-audit" class="mb-32">
            </section>

        <section>
            <h2 class="text-xs font-bold tracking-widest uppercase mb-8 opacity-50">All Past Records</h2>
            <div id="audit-list" class="border-t border-white/10">
                </div>
        </section>
    </main>

    <div id="memo-overlay" class="fixed inset-0 bg-black/95 z-50 hidden p-8 overflow-y-auto">
        <div class="max-w-3xl mx-auto">
            <button onclick="closeMemo()" class="fixed top-8 right-8 text-white hover:text-emerald-400 font-bold">CLOSE [X]</button>
            <pre id="memo-content" class="text-emerald-400 font-mono text-sm leading-relaxed whitespace-pre-wrap pt-20"></pre>
        </div>
    </div>

    <script>
        const REGISTRY_URL = 'audits/registry.json';

        async function loadAudits() {
            try {
                const response = await fetch(REGISTRY_URL);
                const audits = await response.json();
                
                const featuredContainer = document.getElementById('featured-audit');
                const listContainer = document.getElementById('audit-list');

                audits.forEach(audit => {
                    if(audit.featured) {
                        // Remplir l'audit à la Une
                        featuredContainer.innerHTML = `
                            <div class="bg-white text-black p-12">
                                <div class="flex justify-between items-start mb-12">
                                    <div>
                                        <p class="text-[10px] font-bold uppercase tracking-widest mb-2">Featured Audit</p>
                                        <h2 class="text-8xl font-black tracking-tighter">${audit.brand}</h2>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[10px] font-bold uppercase tracking-widest mb-1 opacity-50">Score</p>
                                        <p class="text-5xl font-black">${audit.score}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-12 mb-12 border-t border-black/10 pt-8">
                                    <div>
                                        <p class="text-[10px] font-bold uppercase mb-2">Case ID</p>
                                        <p class="font-mono text-sm uppercase">${audit.id}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] font-bold uppercase mb-2">Proof Hash</p>
                                        <p class="font-mono text-[10px] break-all">${audit.hash}</p>
                                    </div>
                                </div>
                                <button onclick="openMemo('${audit.memo}')" class="bg-black text-white px-10 py-4 text-xs font-bold uppercase tracking-[0.2em] hover:bg-emerald-600 transition-all">
                                    View Full Report →
                                </button>
                            </div>
                        `;
                    } else {
                        // Ajouter à la liste
                        listContainer.innerHTML += `
                            <div class="audit-card flex items-center justify-between py-8 px-4 cursor-pointer" onclick="openMemo('${audit.memo}')">
                                <div class="flex-1">
                                    <p class="text-2xl font-bold">${audit.brand}</p>
                                    <p class="text-[10px] opacity-50 uppercase font-mono mt-1">${audit.id}</p>
                                </div>
                                <div class="flex-1 text-center font-mono text-[10px] hidden md:block opacity-30">
                                    ${audit.hash.substring(0, 24)}...
                                </div>
                                <div class="text-right">
                                    <span class="text-emerald-400 font-bold tracking-tighter text-xl">${audit.score}</span>
                                </div>
                            </div>
                        `;
                    }
                });
            } catch (error) {
                console.error("Erreur de chargement du registre:", error);
            }
        }

        async function openMemo(fileName) {
            try {
                const response = await fetch(fileName);
                const text = await response.text();
                document.getElementById('memo-content').textContent = text;
                document.getElementById('memo-overlay').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                alert("Erreur lors de l'ouverture du mémo.");
            }
        }

        function closeMemo() {
            document.getElementById('memo-overlay').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onload = loadAudits;
    </script>
</body>
</html>
