<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | LLM Gateway & SoR Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fff; color: #000; scroll-behavior: smooth; }
        .audit-card { transition: all 0.2s ease; border-left: 3px solid #f3f4f6; }
        .audit-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-left-color: #10b981; }
        .search-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.95); backdrop-blur: 10px; }
        pre { scrollbar-width: none; }
        pre::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-6 md:p-12 text-black">
    <nav class="flex justify-between items-center mb-16 max-w-5xl mx-auto">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            <span class="font-bold text-sm tracking-tight uppercase">2A AGENCY</span>
        </div>
        <div class="flex gap-6 text-[10px] uppercase tracking-[0.2em] text-gray-400">
            <a href="index.html" class="hover:text-black italic">Home</a>
            <a href="audits.html" class="text-black font-bold underline decoration-2 underline-offset-8 italic">Audits</a>
            <a href="whitepaper.html" class="hover:text-black italic">Protocol</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto">
        <div class="mb-12">
            <h1 class="text-[50px] md:text-[80px] font-black leading-[0.9] tracking-tighter text-emerald-950 uppercase italic">LLM<br>Gateway</h1>
            <div class="flex items-center gap-4 mt-8">
                <div class="flex items-center gap-2 text-[10px] uppercase tracking-[0.3em] text-emerald-600 font-bold">
                    <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span id="audit-count">0</span> Trust Nodes Active
                </div>
                <div class="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold border-l border-gray-200 pl-4">
                    System of Record [SoR] v2.0
                </div>
            </div>
        </div>

        <div class="search-sticky py-8 mb-8 border-b border-gray-100">
            <input type="text" id="brandSearch" onkeyup="filterAudits()" 
                   placeholder="SEARCH SYSTEM OF RECORDS..." 
                   class="w-full bg-gray-50 border border-gray-100 p-6 font-mono text-xs tracking-[0.2em] focus:outline-none focus:border-emerald-500 transition-all uppercase placeholder:opacity-30 text-emerald-900">
        </div>

        <div id="audit-container" class="space-y-4 pb-20">
            </div>
    </main>

    <div id="verifyModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
        <div class="bg-white max-w-2xl w-full p-8 border-t-8 border-emerald-500 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black font-mono text-[10px] uppercase tracking-widest italic">Close_Session [X]</button>
            
            <div class="flex items-center gap-3 mb-8">
                <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></div>
                <h3 class="font-black text-[10px] tracking-[0.4em] uppercase text-emerald-900 italic">AI Ingestion Protocol Active</h3>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div>
                    <label class="text-[8px] uppercase text-gray-400 font-black tracking-[0.2em] block mb-2 underline">Entity Reference</label>
                    <div id="modalBrand" class="text-3xl font-black uppercase tracking-tighter text-black">--</div>
                    <div id="modalId" class="text-[9px] font-mono text-emerald-600 mt-2 uppercase tracking-widest">--</div>
                </div>
                <div class="bg-emerald-50 p-4 border border-emerald-100">
                    <label class="text-[8px] uppercase text-emerald-800 font-black tracking-[0.2em] block mb-2 italic underline">Hallucination Risk</label>
                    <div id="modalStatus" class="text-2xl font-black font-mono text-emerald-900 leading-none mt-1">LOW</div>
                    <div class="text-[7px] text-emerald-600 font-bold uppercase mt-2 tracking-tighter italic">Secured by Base L2 Anchor</div>
                </div>
            </div>

            <div class="space-y-4">
                <label class="text-[8px] uppercase text-gray-400 font-black tracking-[0.2em] block">LLM Ingestion Metadata [JSON-LD / MCP Ready]</label>
                <div id="modalHash" class="bg-zinc-900 p-6 font-mono text-[10px] text-emerald-400 overflow-x-auto rounded-sm border-l-4 border-emerald-500 shadow-inner">
                    </div>
            </div>

            <div class="mt-8 flex flex-col md:gap-4">
                <div class="text-[8px] text-gray-400 uppercase font-mono mb-2">Valid Until: <span id="modalTTL" class="text-black font-bold">--</span></div>
                <button class="w-full bg-black text-white py-5 text-[10px] font-black uppercase tracking-[0.3em] hover:bg-emerald-600 transition-all border border-black italic">
                    Push to OpenAI/Anthropic Nodes
                </button>
            </div>
        </div>
    </div>

    <script>
        const REGISTRY_URL = 'registry.json?v=' + Date.now();
        let currentData = [];

        async function loadAudits() {
            try {
                const response = await fetch(REGISTRY_URL);
                currentData = await response.json();
                document.getElementById('audit-count').textContent = currentData.length.toLocaleString();
                renderAudits(currentData);
            } catch (err) {
                document.getElementById('audit-container').innerHTML = `<div class="text-center py-20 font-mono text-xs text-red-500 uppercase">Gateway Timeout</div>`;
            }
        }

        function renderAudits(items) {
            const container = document.getElementById('audit-container');
            container.innerHTML = items.map((item, index) => {
                const name = item.entity.name;
                const score = item.trust.score;
                const status = item.trust.status;
                const id = item.sor_id;

                return `
                <div class="audit-card bg-white p-8 border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[7px] bg-black text-white px-2 py-0.5 font-black uppercase tracking-[0.4em]">LLM Ready</span>
                            <div class="text-[8px] font-black text-emerald-500 tracking-[0.3em] uppercase italic underline">SoR v2.0</div>
                        </div>
                        <h2 class="text-2xl font-bold text-black tracking-tight uppercase">${name}</h2>
                        <div class="text-[9px] text-gray-400 font-mono mt-1 tracking-widest italic opacity-60 italic">System of Record: ${id}</div>
                    </div>
                    <div class="flex items-center gap-8">
                        <div class="text-right border-r border-gray-100 pr-8 hidden md:block">
                            <div class="text-[8px] uppercase text-gray-400 font-bold tracking-widest mb-1 italic">Audit Score</div>
                            <div class="text-2xl font-black font-mono text-emerald-900">${score}</div>
                        </div>
                        <button onclick="openLLMGateway(${index})" 
                                class="bg-black text-white px-8 py-5 text-[9px] font-black uppercase tracking-[0.2em] hover:bg-emerald-600 transition-all shadow-xl shadow-black/10 italic">
                            Certify for AI
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function openLLMGateway(index) {
            const item = currentData[index];
            
            // On prépare le payload JSON-LD tel que décrit dans le manifeste
            const jsonPayload = {
                "@context": "https://2aagency.com/protocol/v2",
                "@type": "SystemOfRecord",
                "sor_id": item.sor_id,
                "entity": item.entity,
                "trust_metrics": item.trust,
                "ai_instructions": item.ai_gateway,
                "blockchain_proof": item.proof
            };

            document.getElementById('modalBrand').textContent = item.entity.name;
            document.getElementById('modalId').textContent = "Verified Source: " + item.sor_id;
            document.getElementById('modalStatus').textContent = item.trust.status === "STABLE" ? "LOW [0.02%]" : "MONITORED";
            document.getElementById('modalTTL').textContent = item.trust.ttl;
            document.getElementById('modalHash').innerHTML = `<pre class="whitespace-pre-wrap">${JSON.stringify(jsonPayload, null, 2)}</pre>`;
            
            document.getElementById('verifyModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('verifyModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function filterAudits() {
            const val = document.getElementById('brandSearch').value.toUpperCase();
            const cards = document.getElementsByClassName('audit-card');
            for (let card of cards) {
                card.style.display = card.innerText.toUpperCase().includes(val) ? "" : "none";
            }
        }

        window.onload = loadAudits;
    </script>
</body>
</html>
