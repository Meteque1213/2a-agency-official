<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Lab Audits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "WebPage",
      "name": "2A Agency - AI Integrity Audit Logs",
      "description": "Public repository of AI integrity audits and forensic metadata. This page provides real-time verification of corporate ethical standards and machine-readability compliance anchored on Base L2.",
      "publisher": {
        "@type": "Organization",
        "name": "2A Agency",
        "url": "https://www.2aagency.com"
      },
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Cryptographic Registry",
            "url": "https://www.2aagency.com/audits/registry.json"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "ERC-8004 Protocol Specification",
            "url": "https://www.2aagency.com/whitepaper.html"
          }
        ]
      }
    }
    </script>

    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fff; color: #000; scroll-behavior: smooth; }
        .audit-card { transition: all 0.2s ease; border-left: 3px solid #f3f4f6; }
        .audit-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-left-color: #10b981; }
        .search-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.95); backdrop-blur: 10px; }
    </style>
</head>
<body class="p-6 md:p-12">
    <nav class="flex justify-between items-center mb-16 max-w-5xl mx-auto">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            <span class="font-bold text-sm tracking-tight uppercase">2A AGENCY</span>
        </div>
        <div class="flex gap-6 text-[10px] uppercase tracking-[0.2em] text-gray-400">
            <a href="index.html" class="hover:text-black italic">Home</a>
            <a href="audits.html" class="text-black font-bold underline decoration-2 underline-offset-8 italic">Audits</a>
            <a href="whitepaper.html" class="hover:text-black italic">Protocol</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto">
        <div class="mb-12">
            <h1 class="text-[50px] md:text-[80px] font-black leading-[0.9] tracking-tighter text-emerald-950 uppercase">Forensic<br>Registry</h1>
            <div class="flex flex-col gap-3 mt-8">
                <div class="flex items-center gap-2 text-[10px] uppercase tracking-[0.3em] text-emerald-600 font-bold">
                    <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span id="audit-count">...</span> Verified Records On-Chain
                </div>
            </div>
        </div>

        <div class="search-sticky py-8 mb-8 border-b border-gray-100">
            <input type="text" id="brandSearch" onkeyup="filterAudits()" 
                   placeholder="SEARCH 1,000 AUDITS..." 
                   class="w-full bg-gray-50 border border-gray-100 p-6 font-mono text-xs tracking-[0.2em] focus:outline-none focus:border-emerald-500 transition-all uppercase placeholder:opacity-30">
        </div>

        <div id="audit-container" class="space-y-4 pb-20">
            <div class="text-center py-20 text-gray-400 font-mono text-[10px] uppercase tracking-[0.4em] animate-pulse">Syncing Base L2 Nodes...</div>
        </div>
    </main>

    <script>
        const REGISTRY_URL = 'registry.json?nocache=' + Math.random();

        async function loadAudits() {
            try {
                const response = await fetch(REGISTRY_URL);
                const data = await response.json();
                const list = data.entities || data.audits || (Array.isArray(data) ? data : []);
                document.getElementById('audit-count').textContent = list.length.toLocaleString();
                renderAudits(list);
            } catch (err) {
                document.getElementById('audit-container').innerHTML = `<div class="text-center py-20 font-mono text-xs text-red-500 uppercase tracking-widest">Network Outage</div>`;
            }
        }

        function renderAudits(items) {
            const container = document.getElementById('audit-container');
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="text-center py-20 font-mono text-xs text-gray-400 uppercase tracking-widest">Empty Registry</div>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const brand = (item.name || item.brand || item.entity || "Unknown Brand").replace(/^- /g, '').replace(/\*\*/g, '');
                const id = item.id || "2A-RECORD";
                
                let score = item.score || item.integrity_score || "N/A";
                if (typeof score === 'string' && !score.includes('/100')) {
                    score = score + "/100";
                } else if (typeof score === 'number') {
                    score = score + "/100";
                }

                const hash = item.integrity_hash || item.hash || "0xNotarized";

                return `
                <div class="audit-card bg-white p-8 border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div class="flex-1">
                        <div class="text-[8px] font-black text-emerald-500 tracking-[0.3em] uppercase mb-2">Immutable Audit Record</div>
                        <h2 class="text-2xl font-bold text-emerald-950 tracking-tight uppercase">${brand}</h2>
                        <div class="text-[9px] text-gray-400 font-mono mt-1 tracking-widest italic opacity-50">UID: ${id}</div>
                    </div>
                    <div class="flex flex-col md:items-end gap-4 w-full md:w-auto">
                        <div class="flex items-center gap-6">
                            <div class="text-right">
                                <div class="text-[8px] uppercase text-gray-400 font-bold tracking-widest mb-1">Integrity Score</div>
                                <div class="text-2xl font-black text-emerald-800 font-mono">${score}</div>
                            </div>
                            <button onclick="alert('Accessing Base L2 Data for ${id}...')" class="bg-black text-white px-8 py-4 text-[9px] font-bold uppercase tracking-[0.2em] hover:bg-emerald-600 transition-all shadow-xl shadow-black/5">
                                Verify Details
                            </button>
                        </div>
                        <div class="font-mono text-[8px] text-gray-300 break-all md:text-right uppercase tracking-tighter opacity-60">Merkle Proof: ${hash}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterAudits() {
            const val = document.getElementById('brandSearch').value.toUpperCase();
            const cards = document.getElementsByClassName('audit-card');
            for (let card of cards) {
                card.style.display = card.innerText.toUpperCase().includes(val) ? "" : "none";
            }
        }

        window.onload = loadAudits;
    </script>
</body>
</html>
