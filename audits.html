<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Lab Audits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fff; color: #000; scroll-behavior: smooth; }
        .audit-card { transition: all 0.2s ease; border-left: 3px solid #f3f4f6; }
        .audit-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-left-color: #10b981; }
        .search-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.95); backdrop-blur: 10px; }
    </style>
</head>
<body class="p-6 md:p-12 text-black">
    <nav class="flex justify-between items-center mb-16 max-w-5xl mx-auto">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            <span class="font-bold text-sm tracking-tight uppercase">2A AGENCY</span>
        </div>
        <div class="flex gap-6 text-[10px] uppercase tracking-[0.2em] text-gray-400">
            <a href="index.html" class="hover:text-black italic">Home</a>
            <a href="audits.html" class="text-black font-bold underline decoration-2 underline-offset-8 italic">Audits</a>
            <a href="whitepaper.html" class="hover:text-black italic">Protocol</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto">
        <div class="mb-12">
            <h1 class="text-[50px] md:text-[80px] font-black leading-[0.9] tracking-tighter text-emerald-950 uppercase">Forensic<br>Registry</h1>
            <div class="flex items-center gap-2 mt-8 text-[10px] uppercase tracking-[0.3em] text-emerald-600 font-bold">
                <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                <span id="audit-count">0</span> Verified Records On-Chain
            </div>
        </div>

        <div class="search-sticky py-8 mb-8 border-b border-gray-100">
            <input type="text" id="brandSearch" onkeyup="filterAudits()" 
                   placeholder="SEARCH REGISTRY..." 
                   class="w-full bg-gray-50 border border-gray-100 p-6 font-mono text-xs tracking-[0.2em] focus:outline-none focus:border-emerald-500 transition-all uppercase placeholder:opacity-30">
        </div>

        <div id="audit-container" class="space-y-4 pb-20">
            </div>
    </main>

    <div id="verifyModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/95 backdrop-blur-sm">
        <div class="bg-white max-w-lg w-full p-8 border-t-8 border-emerald-500 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black font-mono text-[10px] uppercase tracking-widest">Close [X]</button>
            
            <div class="flex items-center gap-3 mb-8">
                <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></div>
                <h3 class="font-black text-[10px] tracking-[0.4em] uppercase text-emerald-900">Security Protocol Alpha-6</h3>
            </div>
            
            <div class="space-y-8">
                <div>
                    <label class="text-[8px] uppercase text-gray-400 font-bold tracking-[0.2em] block mb-2">Authenticated Entity</label>
                    <div id="modalBrand" class="text-3xl font-black uppercase tracking-tighter text-black">--</div>
                </div>
                
                <div class="grid grid-cols-2 gap-8 border-y border-gray-100 py-6">
                    <div>
                        <label class="text-[8px] uppercase text-gray-400 font-bold tracking-[0.2em] block mb-2">Integrity Score</label>
                        <div id="modalScore" class="text-2xl font-black font-mono text-emerald-800">--</div>
                    </div>
                    <div>
                        <label class="text-[8px] uppercase text-gray-400 font-bold tracking-[0.2em] block mb-2">Network Status</label>
                        <div class="text-[10px] font-bold text-black uppercase tracking-widest bg-emerald-100 px-2 py-1 inline-block">Base L2 Anchored</div>
                    </div>
                </div>

                <div>
                    <label class="text-[8px] uppercase text-gray-400 font-bold tracking-[0.2em] block mb-2">Cryptographic Proof (SHA-256)</label>
                    <div id="modalHash" class="bg-gray-50 p-4 font-mono text-[9px] break-all text-gray-600 uppercase tracking-tighter leading-normal border border-gray-100">--</div>
                </div>

                <button class="w-full bg-black text-white py-5 text-[10px] font-black uppercase tracking-[0.3em] hover:bg-emerald-600 transition-all">
                    Download Official Audit (.PDF)
                </button>
            </div>
        </div>
    </div>

    <script>
        const REGISTRY_URL = 'registry.json?v=' + Date.now();

        async function loadAudits() {
            try {
                const response = await fetch(REGISTRY_URL);
                const list = await response.json();
                document.getElementById('audit-count').textContent = list.length.toLocaleString();
                renderAudits(list);
            } catch (err) {
                document.getElementById('audit-container').innerHTML = `<div class="text-center py-20 font-mono text-xs text-red-500 uppercase tracking-widest">Network Outage</div>`;
            }
        }

        function renderAudits(items) {
            const container = document.getElementById('audit-container');
            container.innerHTML = items.map(item => {
                const brand = (item.brand || "Unknown").replace(/["']/g, "");
                const score = item.score || "N/A";
                const hash = item.integrity_hash || "0xNotarized";
                const id = item.id || "2A-REC";

                return `
                <div class="audit-card bg-white p-8 border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div class="flex-1">
                        <div class="text-[8px] font-black text-emerald-500 tracking-[0.3em] uppercase mb-2">Immutable Record</div>
                        <h2 class="text-2xl font-bold text-black tracking-tight uppercase">${brand}</h2>
                        <div class="text-[9px] text-gray-400 font-mono mt-1 tracking-widest">UID: ${id}</div>
                    </div>
                    <div class="flex items-center gap-8">
                        <div class="text-right">
                            <div class="text-[8px] uppercase text-gray-400 font-bold tracking-widest mb-1">Score</div>
                            <div class="text-2xl font-black font-mono text-emerald-900">${score}/100</div>
                        </div>
                        <button onclick="openModal('${brand}', '${score}', '${hash}')" 
                                class="bg-black text-white px-8 py-4 text-[9px] font-bold uppercase tracking-[0.2em] hover:bg-emerald-600 transition-all shadow-xl shadow-black/5">
                            Verify Details
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function openModal(brand, score, hash) {
            document.getElementById('modalBrand').textContent = brand;
            document.getElementById('modalScore').textContent = score + "/100";
            document.getElementById('modalHash').textContent = hash;
            document.getElementById('verifyModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Empêche le scroll en arrière-plan
        }

        function closeModal() {
            document.getElementById('verifyModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function filterAudits() {
            const val = document.getElementById('brandSearch').value.toUpperCase();
            const cards = document.getElementsByClassName('audit-card');
            for (let card of cards) {
                card.style.display = card.innerText.toUpperCase().includes(val) ? "" : "none";
            }
        }

        window.onload = loadAudits;
    </script>
</body>
</html>
