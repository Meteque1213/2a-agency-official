<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Lab Audits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fff; color: #000; }
        .audit-card { transition: all 0.3s ease; }
        .audit-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-6 md:p-12">

    <nav class="flex justify-between items-center mb-16">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            <span class="font-bold text-sm tracking-tight">2A AGENCY</span>
        </div>
        <div class="flex gap-6 text-xs uppercase tracking-widest text-gray-500">
            <a href="index.html" class="hover:text-black">Home</a>
            <a href="audits.html" class="text-black font-bold">Audits</a>
            <a href="whitepaper.html" class="hover:text-black">Protocol</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto space-y-6">
        
        <div class="mb-12">
            <h1 class="text-[60px] font-bold leading-none tracking-tighter text-emerald-950">FORENSIC<br>LAB AUDITS</h1>
            <div class="flex items-center gap-2 mt-4 text-xs uppercase tracking-widest text-gray-400">
                <div class="w-1.5 h-1.5 bg-gray-300 rounded-full animate-pulse"></div>
                LIVE BLOCKCHAIN FEED: SYNCING WITH BASE L2
            </div>
        </div>

        <div id="audit-container" class="space-y-6">
            </div>

        <div class="border-t border-dashed border-gray-300 mt-16 pt-8 text-center">
            <span class="text-[10px] uppercase tracking-widest text-gray-400 italic font-bold">More reports available in registry...</span>
        </div>

    </main>

    <div id="memo-overlay" class="fixed inset-0 bg-white/98 z-50 hidden p-8 overflow-y-auto backdrop-blur-sm">
        <div class="max-w-3xl mx-auto border border-gray-100 p-12 shadow-2xl bg-white relative">
            <button onclick="closeMemo()" class="absolute top-6 right-6 text-gray-400 hover:text-black font-bold text-xs uppercase tracking-widest">[ Fermer ]</button>
            <pre id="memo-content" class="text-emerald-950 font-mono text-xs leading-relaxed whitespace-pre-wrap pt-10"></pre>
        </div>
    </div>

    <script>
        const REGISTRY_URL = 'audits/registry.json';

        async function loadAudits() {
            try {
                const response = await fetch(REGISTRY_URL);
                const audits = await response.json();
                
                const container = document.getElementById('audit-container');
                container.innerHTML = ''; // Vide le container

                audits.forEach(audit => {
                    // Structure HTML basée EXACTEMENT sur ton design original
                    const auditHTML = `
                        <div class="audit-card bg-gray-50 p-8 border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            
                            <div class="flex flex-col gap-1">
                                <div class="text-[10px] font-bold uppercase tracking-widest text-emerald-500 flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                                    LATEST LIVE NOTARIZATION / SCORE: ${audit.score}
                                </div>
                                <h2 class="text-3xl font-bold tracking-tight text-emerald-950">${audit.brand}</h2>
                                <div class="flex gap-2 mt-2">
                                    <span class="bg-gray-200 text-gray-600 text-[9px] px-2.5 py-1 font-bold uppercase tracking-wider">${audit.id}</span>
                                    <span class="bg-emerald-100 text-emerald-800 text-[9px] px-2.5 py-1 font-bold uppercase tracking-wider">VERIFIED ON-CHAIN</span>
                                </div>
                            </div>

                            <div class="flex flex-col md:items-end gap-4 w-full md:w-auto">
                                <div class="font-mono text-[9px] text-gray-400 break-all max-w-xs text-left md:text-right uppercase leading-relaxed">
                                    HASH: ${audit.hash}<br>
                                    TIMESTAMP: ${new Date().toLocaleDateString('fr-FR')} 17:15:00
                                </div>
                                <button onclick="openMemo('${audit.memo}')" class="bg-black text-white px-8 py-3 text-[10px] font-bold uppercase tracking-widest hover:bg-emerald-700 transition-all w-full md:w-auto text-center">
                                    View Full Audit Report →
                                </button>
                            </div>

                        </div>
                    `;
                    container.innerHTML += auditHTML;
                });
            } catch (error) {
                console.error("Erreur de chargement du registre:", error);
                container.innerHTML = `<p class="text-red-500 text-sm text-center p-8">Erreur lors du chargement des audits. Vérifiez 'audits/registry.json'.</p>`;
            }
        }

        async function openMemo(fileName) {
            try {
                const response = await fetch(fileName);
                const text = await response.text();
                document.getElementById('memo-content').textContent = text;
                document.getElementById('memo-overlay').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                alert("Erreur lors de l'ouverture du mémo.");
            }
        }

        function closeMemo() {
            document.getElementById('memo-overlay').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onload = loadAudits;
    </script>
</body>
</html>
