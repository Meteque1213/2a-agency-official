<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A AGENCY | Forensic Lab Audits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fff; color: #000; scroll-behavior: smooth; }
        .audit-card { transition: all 0.2s ease; border-left: 2px solid transparent; }
        .audit-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-left-color: #10b981; }
        .search-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.9); backdrop-blur: 10px; }
    </style>
</head>
<body class="p-6 md:p-12">
    <nav class="flex justify-between items-center mb-16 max-w-5xl mx-auto">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            <span class="font-bold text-sm tracking-tight uppercase">2A AGENCY</span>
        </div>
        <div class="flex gap-6 text-xs uppercase tracking-widest text-gray-500">
            <a href="index.html" class="hover:text-black italic">Home</a>
            <a href="audits.html" class="text-black font-bold underline decoration-2 underline-offset-8 italic">Audits</a>
            <a href="whitepaper.html" class="hover:text-black italic">Protocol</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto">
        <div class="mb-12">
            <h1 class="text-[50px] md:text-[80px] font-bold leading-none tracking-tighter text-emerald-950 uppercase">Forensic<br>Registry</h1>
            <div class="flex flex-col gap-3 mt-6">
                <div class="flex items-center gap-2 text-[10px] uppercase tracking-[0.3em] text-emerald-600 font-bold">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span id="audit-count">1000</span> Verified Records On-Chain
                </div>
                <a href="registry.json" target="_blank" class="text-[9px] text-gray-400 hover:text-emerald-500 font-mono tracking-widest uppercase border-b border-gray-100 w-fit pb-1 transition-colors">
                    Export Raw Audit Data (JSON)
                </a>
            </div>
        </div>

        <div class="search-sticky py-6 mb-12 border-b border-gray-100 font-bold">
            <input type="text" id="brandSearch" onkeyup="filterAudits()" 
                   placeholder="SEARCH REGISTRY (BRAND, ID, SCORE)..." 
                   class="w-full bg-gray-50 border border-gray-200 p-6 font-mono text-xs tracking-[0.2em] focus:outline-none focus:border-emerald-500 transition-all uppercase">
        </div>

        <div id="audit-container" class="space-y-4">
            <div class="text-center py-20 text-gray-400 font-mono text-[10px] uppercase tracking-widest animate-pulse">Syncing Forensic Data from Base L2...</div>
        </div>
    </main>

    <div id="memo-overlay" class="fixed inset-0 bg-white/98 z-[100] hidden p-4 md:p-12 overflow-y-auto backdrop-blur-md">
        <div class="max-w-3xl mx-auto border border-gray-200 p-8 md:p-16 shadow-2xl bg-white relative mt-10">
            <button onclick="closeMemo()" class="absolute top-6 right-6 text-gray-400 hover:text-black font-bold text-[10px] uppercase tracking-widest bg-gray-50 px-4 py-2 rounded-full transition-colors border border-gray-100">
                [ Fermer / Close ]
            </button>
            <div class="mb-8 border-b border-gray-100 pb-8 text-center">
                <div class="text-emerald-500 font-bold text-[10px] tracking-widest uppercase mb-2 italic">Official Forensic Notarization</div>
                <div id="memo-title" class="text-2xl font-bold tracking-tighter text-emerald-950 uppercase">REPORT</div>
            </div>
            <pre id="memo-content" class="text-emerald-950 font-mono text-[11px] md:text-xs leading-relaxed whitespace-pre-wrap pt-4 bg-gray-50 p-6 border border-gray-100 rounded-sm"></pre>
        </div>
    </div>

    <script>
        const REGISTRY_URL = 'registry.json?v=' + Date.now();
        let allAudits = [];

        async function loadAudits() {
            try {
                const response = await fetch(REGISTRY_URL, { cache: "no-store" });
                const data = await response.json();
                
                // Correction majeure : on récupère la clé "entities"
                allAudits = data.entities || [];
                
                const countElem = document.getElementById('audit-count');
                if (countElem && data.registry_metadata) {
                    countElem.textContent = data.registry_metadata.entities_count;
                }

                renderAudits(allAudits);
            } catch (error) {
                console.error("Registry Load Error:", error);
                document.getElementById('audit-container').innerHTML = `
                    <div class="text-center py-20 text-red-500 font-mono text-xs uppercase tracking-widest">
                        ERROR: SYSTEM OF RECORD OFFLINE
                    </div>`;
            }
        }

        function renderAudits(data) {
            const container = document.getElementById('audit-container');
            container.innerHTML = data.map(audit => {
                // Nettoyage du nom (enlève les tirets et markdown éventuels)
                const name = (audit.name || "N/A").replace(/^- /g, '').replace(/\*\*/g, '').trim();
                const hash = audit.integrity_hash || "NOTARIZED";
                const id = audit.id || "2A-ID";
                const score = audit.score || "0";
                const memoPath = `audits/MEMO_${id}.txt`;

                return `
                <div class="audit-card bg-white p-6 border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                             <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                             <div class="text-[8px] font-bold text-emerald-600 tracking-[0.2em] uppercase">Immutable Record</div>
                        </div>
                        <h2 class="text-xl font-bold text-emerald-950 tracking-tight uppercase">${name}</h2>
                        <div class="text-[9px] text-gray-400 font-mono mt-1 tracking-widest italic">ID: ${id}</div>
                    </div>
                    <div class="flex flex-col md:items-end gap-3 w-full md:w-auto min-w-[250px]">
                        <div class="flex items-center gap-4 md:justify-end">
                            <div class="text-right">
                                <div class="text-[8px] uppercase text-gray-400 font-bold tracking-widest">Integrity Score</div>
                                <div class="text-lg font-black text-emerald-700 font-mono">${score}/100</div>
                            </div>
                            <button onclick="openMemo('${memoPath}', '${name.replace(/'/g, "\\'")}')" 
                                    class="bg-black text-white px-6 py-3 text-[9px] font-bold uppercase tracking-widest hover:bg-emerald-600 transition-all shadow-lg shadow-black/5">
                                Review Audit
                            </button>
                        </div>
                        <div class="font-mono text-[8px] text-gray-300 break-all md:text-right uppercase tracking-tighter">Anchor: ${hash}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterAudits() {
            const query = document.getElementById('brandSearch').value.toUpperCase();
            const cards = document.getElementsByClassName('audit-card');
            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('h2').innerText.toUpperCase();
                const id = cards[i].querySelector('.font-mono').innerText.toUpperCase();
                cards[i].style.display = (title.includes(query) || id.includes(query)) ? "" : "none";
            }
        }

        async function openMemo(path, title) {
            try {
                const response = await fetch(path);
                const text = await response.text();
                document.getElementById('memo-title').textContent = title;
                document.getElementById('memo-content').textContent = text;
                document.getElementById('memo-overlay').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                alert("Loading details from Base L2...");
            }
        }

        function closeMemo() {
            document.getElementById('memo-overlay').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onload = loadAudits;
    </script>
</body>
</html>
