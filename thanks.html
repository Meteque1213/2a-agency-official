<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2A Agency | Signal Reçu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; color: #050505; }
        .text-2a-emerald { color: #064e3b; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="max-w-xl w-full border border-gray-200 p-12 bg-white shadow-sm">
        <div class="flex items-center gap-3 mb-8 opacity-40 uppercase tracking-widest text-[10px] font-bold">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            Communication Sécurisée Établie
        </div>
        
        <h1 class="text-4xl font-black uppercase tracking-tighter text-2a-emerald mb-6">
            Merci de votre signalement.
        </h1>
        
        <p class="text-sm leading-relaxed opacity-70 mb-8">
            Votre requête a été transmise à la <strong>Forensic Intelligence Unit</strong> de 2A Agency. 
            Nos analystes procèdent actuellement à la vérification des métadonnées. 
            Une réponse vous sera adressée après notarisation de votre dossier.
        </p>
        
        <div class="pt-8 border-t border-gray-100">
            <a href="index.html" class="text-xs font-black uppercase tracking-widest border-b-2 border-black pb-1 hover:text-emerald-900 hover:border-emerald-900 transition-all">
                ← Retour au Terminal
            </a>
        </div>
    </div>
</body>
</html>
